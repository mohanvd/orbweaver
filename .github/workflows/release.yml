name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Bundle matches the committed one
        run: git diff --exit-code -- dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/orbweaver.js \
            --title "$GITHUB_REF_NAME" \
            --notes "Paste \`orbweaver.js\` into the Discord console. Usage is in the [README](https://github.com/${GITHUB_REPOSITORY}#usage), changes are in the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
